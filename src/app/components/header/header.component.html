<header class="bg-white/70 backdrop-blur-xl shadow-lg sticky top-0 z-50 border-b border-gray-100">
  <nav class="container-custom">
    <div class="flex justify-between items-center py-4">
      <!-- Logo -->
      <div class="flex items-center space-x-2">
        <img src="assets/images/Bytrix-04.png" alt="Bytrix Hub Logo" class="w-9 h-9 drop-shadow-md" />
        <a routerLink="/" class="text-2xl font-bold gradient-text tracking-tight">
          Bytrix Hub
        </a>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-8">
        <a *ngFor="let link of navLinks" [routerLink]="link.path"
          routerLinkActive="text-primary-600 border-b-2 border-primary-600"
          class="text-gray-700 hover:text-primary-600 transition-all duration-300 font-medium">
          {{ link.label }}
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <div class="md:hidden">
        <button (click)="toggleMenu()"
          class="text-gray-700 hover:text-primary-600 focus:outline-none focus:text-primary-600">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path *ngIf="!isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16" />
            <path *ngIf="isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation -->
    <div *ngIf="isMenuOpen" class="md:hidden bg-white/80 backdrop-blur-lg border-t border-gray-200">
      <div class="px-4 py-3 space-y-2">
        <a *ngFor="let link of navLinks" [routerLink]="link.path" (click)="closeMenu()"
          class="block px-3 py-2 text-gray-700 hover:text-primary-600 transition-all duration-300 font-medium">
          {{ link.label }}
        </a>
      </div>
    </div>
  </nav>
</header>
