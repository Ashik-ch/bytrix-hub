<section class="bg-gradient-to-br from-primary-50 to-accent-50 section-padding">
    <div class="container-custom">
        <div class="text-center max-w-4xl mx-auto">
            <h1 class="text-5xl font-bold text-gray-900 mb-6 fade-in">
                News & <span class="gradient-text">Updates</span>
            </h1>
            <p class="text-xl text-gray-600 leading-relaxed fade-in">
                Explore the latest updates, trends, and innovations from our creative tech team.
            </p>
        </div>
    </div>
</section>
<section
    class="section-padding min-h-screen py-20 px-6 md:px-20 bg-gradient-to-b from-slate-900 via-slate-800 to-slate-900 text-white">
    <div class="grid gap-10 md:grid-cols-2 lg:grid-cols-3">
        <div *ngFor="let news of newsList"
            class="group backdrop-blur-lg bg-white/10 border border-white/10 rounded-2xl overflow-hidden shadow-lg hover:shadow-cyan-500/30 transition-all duration-500">

            <div class="relative overflow-hidden">
                <img [src]="news.image" alt="{{news.title}}"
                    class="w-full h-56 object-cover transition-transform duration-700 group-hover:scale-110" />
                <span class="absolute top-4 left-4 bg-cyan-500/80 text-xs px-3 py-1 rounded-full font-medium">
                    {{news.category}}
                </span>
            </div>

            <div class="p-6">
                <h3 class="text-xl font-semibold mb-2 group-hover:text-cyan-400 transition-colors">{{news.title}}
                </h3>
                <p class="text-slate-400 text-sm mb-3">{{news.date}}</p>
                <p class="text-slate-300 mb-4">{{news.description}}</p>
                <a [href]="news.link"
                    class="inline-block text-cyan-400 hover:text-cyan-300 font-medium transition-colors">
                    Read More →
                </a>
            </div>
        </div>
    </div>
</section>
