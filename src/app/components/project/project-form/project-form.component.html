<section
    class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 flex items-center justify-center px-4">
    <div class="w-full max-w-2xl">

        <div class="relative backdrop-blur-xl bg-white/10 border border-white/20 rounded-3xl shadow-2xl p-8 md:p-10">

            <div
                class="absolute -inset-1 rounded-3xl bg-gradient-to-r from-indigo-500 via-cyan-400 to-purple-600 opacity-20 blur">
            </div>

            <div class="relative">
                <h2 class="text-3xl md:text-4xl font-bold text-white mb-2 tracking-tight">
                    New Project
                </h2>
                <p class="text-slate-300 mb-8">
                    Add project details & track payments
                </p>

                <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">

                    <div>
                        <label class="block text-sm text-slate-300 mb-2">Project Name</label>
                        <input type="text" formControlName="name" placeholder="Website Redesign"
                            class="w-full rounded-xl bg-slate-900/70 border border-white/10 text-white px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                        <div>
                            <label class="block text-sm text-slate-300 mb-2">Payment (AED)</label>
                            <input type="number" formControlName="payment" placeholder="5000"
                                class="w-full rounded-xl bg-slate-900/70 border border-white/10 text-white px-4 py-3 focus:ring-2 focus:ring-indigo-400" />
                        </div>
                        <div>
                            <label class="block text-sm text-slate-300 mb-2">Date</label>
                            <input type="date" formControlName="date"
                                class="w-full rounded-xl bg-slate-900/70 border border-white/10 text-white px-4 py-3 focus:ring-2 focus:ring-purple-400" />
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm text-slate-300 mb-2">Status</label>
                        <select formControlName="status"
                            class="w-full rounded-xl bg-slate-900/70 border border-white/10 text-white px-4 py-3 focus:ring-2 focus:ring-cyan-400">
                            <option value="Pending">Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                            <option value="On Hold">On Hold</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm text-slate-300 mb-2">Notes</label>
                        <textarea rows="4" formControlName="notes" placeholder="Additional project information..."
                            class="w-full rounded-xl bg-slate-900/70 border border-white/10 text-white px-4 py-3 focus:ring-2 focus:ring-indigo-400"></textarea>
                    </div>
                    <button type="submit" [disabled]="form.invalid"
                        class="w-full mt-4 py-3 rounded-xl font-semibold text-white bg-gradient-to-r from-indigo-500 via-cyan-500 to-purple-600 hover:scale-[1.02] transition-transform shadow-lg disabled:opacity-50">
                        Save Project
                    </button>
                    <button (click)="getData()"
                        class="w-full mt-4 py-3 rounded-xl font-semibold text-white bg-gradient-to-r from-indigo-500 via-cyan-500 to-purple-600 hover:scale-[1.02] transition-transform shadow-lg disabled:opacity-50">
                        GetDAta
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
