<section
    class="relative py-20 bg-gradient-to-br from-gray-700 md:min-h-screen via-gray-800 to-black text-white overflow-hidden">

    <div class="container-custom relative z-10">
        <div class="text-center mb-16">
            <h2
                class="text-5xl font-bold tracking-tight bg-gradient-to-r from-primary-400 to-accent-400 bg-clip-text text-transparent">
                What Our Clients Say
            </h2>
            <p class="text-lg text-gray-300 max-w-3xl mx-auto">
                Don't just take our word for it. Here's what our satisfied clients have to say about our services.
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <div *ngFor="let testimonial of testimonials; let i = index" class="relative group p-8 rounded-3xl bg-white/10 backdrop-blur-xl border border-white/20 shadow-2xl overflow-hidden cursor-pointer 
        transform transition-all duration-500 hover:-translate-y-3 hover:shadow-pink-500/30"
                [style.animation-delay]="(i * 0.1) + 's'">

                <!-- Neon accent top line -->
                <div
                    class="absolute top-0 left-1/2 w-16 h-1 bg-gradient-to-r from-purple-400 to-pink-400 rounded-full -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                </div>

                <!-- Content -->
                <div class="relative z-10 space-y-4">
                    <div class="flex items-center mb-4">
                        <img [src]="testimonial.image" [alt]="testimonial.name"
                            class="w-16 h-16 rounded-full object-cover mr-4 border-2 border-purple-500/50 shadow-lg">
                        <div>
                            <h4 class="font-bold text-white">{{ testimonial.name }}</h4>
                            <p class="text-purple-300 text-sm">{{ testimonial.role }}, {{ testimonial.company }}</p>
                        </div>
                    </div>

                    <!-- Stars -->
                    <div class="flex mb-4">
                        <i *ngFor="let star of [1,2,3,4,5]"
                            class="fas fa-star text-yellow-400 transition-transform duration-300 group-hover:scale-110"></i>
                    </div>

                    <!-- Testimonial Text -->
                    <p class="text-gray-300 italic leading-relaxed">
                        "{{ testimonial.content }}"
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
