@if(isVisible) {
<div class="fixed bottom-6 right-6 z-50 flex flex-col items-end">

  <!-- Chat Window -->
  @if(showChat) {
  <div
    class="mb-4 w-80 bg-white shadow-2xl rounded-2xl border border-gray-200 flex flex-col overflow-hidden animate-fadeIn z-10">
    <div class="bg-primary-600 text-white p-3 font-semibold flex justify-between items-center">
      <span>💬 BytrixHub Assistant</span>
      <button (click)="showChat = false" class="text-white hover:text-gray-200 text-lg">&times;</button>
    </div>

    <div class="flex-1 p-3 space-y-2 overflow-y-auto max-h-80">
      <div *ngFor="let msg of messages">
        <div [ngClass]="msg.from === 'user' ? 'text-right' : 'text-left'">
          <div [ngClass]="msg.from === 'user'
                  ? 'bg-primary-600 text-white inline-block px-3 py-2 rounded-xl'
                  : 'bg-primary-100 text-gray-800 inline-block px-3 py-2 rounded-xl'">
            {{ msg.text }}
          </div>
        </div>
      </div>
    </div>

    <div class="p-2 border-t flex">
      <input type="text" [(ngModel)]="userMessage" (keyup.enter)="sendMessage()" placeholder="Type your message..."
        class="flex-1 border rounded-lg px-3 py-2 focus:outline-none" />
      <button (click)="sendMessage()" class="ml-2 bg-primary-600 text-white px-4 py-2 rounded-lg">
        Send
      </button>
    </div>
  </div>
  }

  <!-- Expanded Menu -->
  @if(isExpanded) {
  <div class="mb-4 space-y-3 z-10">
    <button (click)="openWhatsApp()"
      class="flex items-center space-x-3 bg-green-500 hover:bg-green-600 text-white px-4 py-3 rounded-full shadow-lg transition-all duration-300 transform hover:scale-105 z-10">
      <i class="fab fa-whatsapp text-xl"></i>
      <span class="font-medium">WhatsApp</span>
    </button>

    <button (click)="openChat()"
      class="flex items-center space-x-3 bg-primary-600 hover:bg-primary-700 text-white px-4 py-3 rounded-full shadow-lg transition-all duration-300 transform hover:scale-105 z-10">
      <i class="fas fa-comments text-xl"></i>
      <span class="font-medium">Live Chat</span>
    </button>
  </div>
  }

  <!-- Main Floating Button -->
  <button (click)="toggleExpanded()"
    class="w-14 h-14 bg-primary-600 hover:bg-primary-700 text-white rounded-full shadow-lg flex items-center justify-center transition-all duration-300 transform hover:scale-110 z-10">
    @if(!isExpanded) { <i class="fas fa-comments text-xl"></i> }
    @if(isExpanded) { <i class="fas fa-times text-xl"></i> }
  </button>

  <!-- Pulse Effect Behind Everything -->
  <div class="absolute inset-0 bg-primary-600 rounded-full animate-ping opacity-20 -z-10"></div>
</div>
}
