  <meta name="keywords"
    content="Bytrix Hub, digital marketing, SEO, Google Ads, social media marketing, web development, app development, creative services, branding, local business growth">

  <meta property="og:title" content="Bytrix Hub - Where Creativity Meets Technology">
  <meta property="og:description" content="We Build Brands & Digital Experiences">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bytrixhub.com">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="assets/images/Bytrix-04.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-58DP0EDGLF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-58DP0EDGLF');
  </script>

  <!-- Start Single Page Apps for GitHub Pages -->
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // https://github.com/rafrex/spa-github-pages
    // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
  <!-- End Single Page Apps for GitHub Pages -->

  <!-- Simple Loader Styles -->
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      flex-direction: column;
    }

    #app-loader img {
      width: 70px;
      height: 70px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.7;
        transform: scale(0.95);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>
  <div id="app-loader">
    <img src="assets/images/Bytrix-04.png" alt="Bytrix Hub Logo" />
    <p style="color:#444;margin-top:10px;font-weight:500;">Bytrix Hub...</p>
  </div>

  <app-root></app-root>

  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('app-loader');
      if (loader) loader.style.display = 'none';
    });
  </script>
</body>

</html>
